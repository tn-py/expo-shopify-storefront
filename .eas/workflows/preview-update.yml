# EAS Workflow — example, not wired up automatically.
#
# EAS Workflows run on Expo's infrastructure, triggered by the EAS GitHub
# app (not GitHub Actions). To use this:
#   1. `eas init` (links this repo to an EAS project; sets EAS_PROJECT_ID).
#   2. Install the EAS GitHub app on this repo: https://expo.dev/settings/github
#   3. Push this file — EAS starts triggering workflows in `.eas/workflows/`
#      on matching events automatically, no other setup needed.
#   4. Configure EAS Environment Variables for the `preview` environment
#      (dashboard → Project → Environment variables) so this build resolves
#      the right `EXPO_PUBLIC_*` values (see eas.json's `environment` keys).
#
# Docs: https://docs.expo.dev/eas/workflows/get-started/
#
# What this does: publishes an EAS Update to the `preview` channel whenever a
# pull request is opened/updated, so reviewers can preview JS/asset changes
# on a build already installed from the `preview` channel — no rebuild
# needed. This only ships JS/asset changes; a change to native config or a
# native dependency needs a new `preview` build (see production-build.yml
# for the build job shape) rather than this update.

name: Preview update

on:
  pull_request:
    branches: ['main']

jobs:
  update:
    name: Publish preview update
    type: update
    params:
      channel: preview
      message: ${{ github.event.pull_request.title }}
